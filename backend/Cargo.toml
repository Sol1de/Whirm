[package]
name = "whirm"
version = "1.0.0"
description = "A desktop app to manage your proxies, switch between them, and route your network traffic with ease."
authors = ["S0lide <olide754@gmail.com>"]
license = "MIT"
repository = "https://github.com/Sol1de/Whirm"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
pretty_assertions = "1.4"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
sysproxy = "0.3"
reqwest = { version = "0.13.3", features = ["rustls", "socks"] }
tokio = { version = "1.52.1", features = ["full"] }
urlencoding = "2"
sea-orm = { version = "=2.0.0-rc.38", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "=2.0.0-rc.38", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
machine-uid = "0.5"
hkdf = "0.13"
sha2 = "0.11"
base64 = "0.22"
async-trait = "0.1"
tokio-socks = "0.5"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
